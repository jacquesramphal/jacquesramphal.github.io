<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Jacques Ramphal — Agentic Experience, Design Systems & Code"
    />
    <meta
      name="description"
      content="Full Stack Design Lead at Orium with 15 years experience. Specializing in design systems, agentic AI, and bridging design-development workflows through code and tokens."
    />
    <meta name="keywords" content="design systems, agentic AI, design tokens, design engineering" />
    <meta name="author" content="Jacques Ramphal" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <link rel="canonical" href="https://ramphal.design/" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Jacques Ramphal — Writing"
      href="https://ramphal.design/rss.xml"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ramphal.design/" />
    <meta property="og:title" content="Jacques Ramphal — Agentic Experience, Design Systems & Code" />
    <meta
      property="og:description"
      content="Senior Product Designer specializing in design systems, agentic AI, and design-development workflows. 15 years at Orium building token-based systems and AI platforms."
    />
    <meta property="og:image" content="https://ramphal.design/og-image.png" />
    <meta property="og:site_name" content="Jacques Ramphal Portfolio" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ramphal.design/" />
    <meta property="twitter:title" content="Jacques Ramphal — Agentic Experience, Design Systems & Code" />
    <meta
      property="twitter:description"
      content="Senior Product Designer specializing in design systems, agentic AI, and design-development workflows."
    />
    <meta property="twitter:image" content="https://ramphal.design/og-image.png" />

    <!-- Schema.org for Google -->
    <meta itemprop="name" content="Jacques Ramphal" />
    <meta
      itemprop="description"
      content="Full Stack Design Lead at Orium with 15 years experience in design systems and agentic AI."
    />
    <meta itemprop="image" content="https://ramphal.design/og-image.png" />

    <link rel="icon" href="<%= BASE_URL %>fav-dynamic.svg" />
    <!-- Syntax-highlighting theme: only needed on pages with code blocks, so it
         is loaded non-render-blocking (preload → swap to stylesheet onload). -->
    <link
      rel="preload"
      as="style"
      href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.9.0/styles/default.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.9.0/styles/default.min.css"
      />
    </noscript>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load the webfont without blocking first paint. `display=swap` already
         renders fallback text immediately; the preload→swap pattern also stops
         the stylesheet request itself from holding up rendering. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jacques Ramphal",
        "jobTitle": "Senior Product Designer & Design Lead",
        "worksFor": {
          "@type": "Organization",
          "name": "Orium"
        },
        "url": "https://ramphal.design",
        "sameAs": ["https://www.linkedin.com/in/ramphal-design/", "https://github.com/jacquesramphal"],
        "knowsAbout": [
          "Design Systems",
          "Agentic AI",
          "UX Design",
          "Design Tokens",
          "Product Design",
          "AI/UX Integration",
          "Design Engineering"
        ],
        "description": "Senior Product Designer with 15 years at Orium, specializing in token-based design systems and agentic AI platforms. I architect design systems and workflows so designers and developers spend less time arguing over specs and more time shipping.",
        "alumniOf": {
          "@type": "Organization",
          "name": "Orium"
        }
      }
    </script>

    <!-- Analytics: loaded async so it never blocks HTML parsing or first paint.
         init runs from onload once the script is available. -->
    <script
      async
      src="https://getinsights.io/js/insights.js"
      onload="insights.init('xtk6brD0rPPePrkC');insights.trackPages();"
    ></script>
    <title>Jacques Ramphal — Agentic Experience, Design Systems & Code</title>

    <!-- SPA redirect decode for GitHub Pages — must run before app boots -->
    <!-- https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without
        JavaScript enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
  </body>
</html>
