                - paragraph [ref=e43]: Thirteen years at the seam between design and engineering. Toronto. Designing systems, writing production code, and building with AI.
              - paragraph [ref=e44]:
                - img "Jacques Ramphal" [ref=e45]
            - generic [ref=e47]:
              - heading "What I care about" [level=2] [ref=e48]
              - paragraph [ref=e49]: I care most about the gap between design intent and what actually ships. Not just how things look, but how decisions survive handoff, how systems scale across teams and brands, and how people stay in control when the tools get smarter.
            - generic [ref=e51]:
              - heading "What I've been building" [level=2] [ref=e52]
              - paragraph [ref=e53]:
                - text: I led the design of
                - link "Genie" [ref=e54] [cursor=pointer]:
                  - /url: /doc/designing-genie
                - text: ", an agentic AI platform built to automate the mechanical parts of delivery work so designers can spend their energy on what actually requires judgment. Building it changed how I work. I went in as a designer and came out also an AI developer, a workflow orchestration practitioner, and a reluctant product thinker. I'm still mostly a designer."
            - generic [ref=e56]:
              - heading "How I work" [level=2] [ref=e57]
              - paragraph [ref=e58]: I write production front-end code, run design QA, and pair with engineers on implementation because I've seen too many good decisions die in handoff. I also coach designers who want to move closer to systems and code, not because everyone needs to write code, but because fluency removes friction and changes the kinds of conversations you can have.
              - paragraph [ref=e59]:
                - text: I maintain a set of
                - link "open-source tools" [ref=e60] [cursor=pointer]:
                  - /url: /library
                - text: and write about design, AI, and the places they intersect.
            - generic [ref=e62]:
              - heading "The site" [level=2] [ref=e63]
              - paragraph [ref=e64]: "Live since 2013. Most of what's here started as something I needed to think through: a problem, a pattern, a method that kept proving itself. Writing it down was the test. If I couldn't explain it, I didn't understand it yet."
              - paragraph [ref=e65]: Work, writing, and tools I built because nothing else did what I needed. Some of it will age badly. Most of it reflects where I was at the time, which is the point.
              - paragraph [ref=e66]: I don't have social media. Not as a statement, just a choice that's held up. It means this site is the primary record. What I make here is what persists.
              - paragraph [ref=e67]: The design is part of the argument. I built it, maintain it, and keep changing it. The source is public, the tools are documented, and the case studies explain the thinking behind the decisions. A designer who writes production code is a claim that's easy to make; the site is the evidence.
              - paragraph [ref=e68]: If you're reading this after I've moved on from whatever I'm doing now, the work is still here.
