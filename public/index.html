    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jacques Ramphal",
        "jobTitle": "Senior Product Designer & Design Lead",
        "worksFor": {
          "@type": "Organization",
          "name": "Orium"
        },
        "url": "https://ramphal.design",

        "knowsAbout": [
          "Design Systems",
          "Agentic AI",
          "UX Design",
          "Design Tokens",
          "Product Design",
          "AI/UX Integration",
          "Design Engineering"
        ],
        "description": "I've designed for fifteen years and I'm still doing the work while it changes shape under me. I write here about what that's actually like: the judgment calls, the uncertainty, the days that don't resolve into a lesson. The work itself is on the site too.",
        "alumniOf": {
          "@type": "Organization",
          "name": "Orium"
        }
      }
    </script>

    <script src="https://getinsights.io/js/insights.js"></script>
    <script>
      insights.init('xtk6brD0rPPePrkC');
      insights.trackPages();
    </script>
    <title>Jacques Ramphal - Designer - Thinking in public</title>

    <!-- SPA redirect decode for GitHub Pages — must run before app boots -->
    <!-- https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded[0] + (decoded[1] ? '?' + decoded[1] : '') + l.hash
          );
        }
      })(window.location);
    </script>
